<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 184" width="840" height="184" role="img" aria-label="Zeynep Ruveyda Kaleli — Design-minded full-stack and mobile developer">
  <defs>
    <clipPath id="card-clip">
      <rect x="0.5" y="0.5" width="839" height="183" rx="14" ry="14" />
    </clipPath>
    <radialGradient id="aurora-violet" cx="85%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.20" />
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="55%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#fafafa" fill-opacity="0.05" />
    </pattern>
  </defs>

  <g clip-path="url(#card-clip)">
    <!-- Surface -->
    <rect width="840" height="184" fill="#09090b" />
    <rect x="540" y="0" width="300" height="184" fill="url(#dot-grid)" />
    <rect width="840" height="184" fill="url(#aurora-violet)" />

    <!-- Subtle geometric rings -->
    <circle cx="775" cy="92" r="76" fill="none" stroke="#8b5cf6" stroke-opacity="0.14" stroke-width="1" />
    <circle cx="775" cy="92" r="52" fill="none" stroke="#ec4899" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Eyebrow -->
    <text x="40" y="45" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.4">
      CARLETON UNIVERSITY · B.C.S. HONOURS &amp; PSYCHOLOGY
    </text>

    <!-- Status pill -->
    <rect x="586" y="26" width="214" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <circle cx="601" cy="39" r="3.5" fill="#34d399" />
    <text x="613" y="42.5" fill="#d4d4d8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.2" font-weight="500" letter-spacing="0.6">
      OPEN TO SWE &amp; MOBILE ROLES
    </text>

    <!-- Name -->
    <text x="40" y="98" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="33" font-weight="700" letter-spacing="-0.3">
      Zeynep Ruveyda Kaleli
    </text>

    <!-- Tagline -->
    <text x="40" y="128" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">
      Design-minded full-stack &amp; mobile developer — crafting clean, human-centered software.
    </text>

    <!-- Accent bar -->
    <rect x="40" y="154" width="128" height="3.5" rx="1.75" fill="url(#accent-bar)" />

    <!-- Bottom-right handle -->
    <text x="800" y="159" text-anchor="end" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">
      toronto · ottawa · @rubykaleli
    </text>
  </g>

  <!-- Crisp border -->
  <rect x="0.5" y="0.5" width="839" height="183" rx="14" ry="14" fill="none" stroke="#27272a" stroke-width="1" />
</svg>
