<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 184" width="840" height="184" role="img" aria-label="Zeynep Ruveyda Kaleli — Design-minded full-stack and mobile developer">
  <defs>
    <clipPath id="card-clip">
      <rect x="0.5" y="0.5" width="839" height="183" rx="14" ry="14" />
    </clipPath>
    <radialGradient id="aurora-light" cx="85%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.11" />
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="55%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#09090b" fill-opacity="0.05" />
    </pattern>
  </defs>

  <g clip-path="url(#card-clip)">
    <!-- Surface -->
    <rect width="840" height="184" fill="#ffffff" />
    <rect x="540" y="0" width="300" height="184" fill="url(#dot-grid)" />
    <rect width="840" height="184" fill="url(#aurora-light)" />

    <!-- Subtle geometric rings -->
    <circle cx="775" cy="92" r="76" fill="none" stroke="#7c3aed" stroke-opacity="0.14" stroke-width="1" />
    <circle cx="775" cy="92" r="52" fill="none" stroke="#db2777" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Eyebrow -->
    <text x="40" y="45" fill="#7c3aed" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.4">
      CARLETON UNIVERSITY · B.C.S. HONOURS &amp; PSYCHOLOGY
    </text>

    <!-- Status pill -->
    <rect x="586" y="26" width="214" height="26" rx="13" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1" />
    <circle cx="601" cy="39" r="3.5" fill="#10b981" />
    <text x="613" y="42.5" fill="#3f3f46" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.2" font-weight="500" letter-spacing="0.6">
      OPEN TO SWE &amp; MOBILE ROLES
    </text>

    <!-- Name -->
    <text x="40" y="98" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="33" font-weight="700" letter-spacing="-0.3">
      Zeynep Ruveyda Kaleli
    </text>

    <!-- Tagline -->
    <text x="40" y="128" fill="#52525b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">
      Design-minded full-stack &amp; mobile developer — crafting clean, human-centered software.
    </text>

    <!-- Accent bar -->
    <rect x="40" y="154" width="128" height="3.5" rx="1.75" fill="url(#accent-bar)" />

    <!-- Bottom-right handle -->
    <text x="800" y="159" text-anchor="end" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">
      toronto · ottawa · @rubykaleli
    </text>
  </g>

  <!-- Crisp border -->
  <rect x="0.5" y="0.5" width="839" height="183" rx="14" ry="14" fill="none" stroke="#e4e4e7" stroke-width="1" />
</svg>
